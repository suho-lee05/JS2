<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - Seat Ninja</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-shell">
        <!-- <header class="hero">
            <span class="chip">Seat Ninja</span>
        </header> -->
        
        <section class="card col-5 login-card" style="max-width: 480px; margin: 0 auto;">
            <div class="login-header">
                <span class="chip">Seat Ninja</span>
                <h2>❄️ 로그인</h2>
            </div>
            <p class="muted">아이디와 비밀번호를 입력해주세요.</p>

            <div class="form-field">
                <label for="userId">아이디</label>
                <input type="text" id="userId" class="input-field" placeholder="아이디 입력">
            </div>

            <div class="form-field">
                <label for="userPw">비밀번호</label>
                <input type="password" id="userPw" class="input-field" placeholder="비밀번호 입력">
            </div>

            <button type="button" class="btn btn-primary" onclick="login()">로그인</button>
            <!-- <button type="button" class="btn btn-primary" onclick="login()">로그인</button> -->
            <div class="options">
                <p><a href="https://login-proxy-server.onrender.com/forgot-password">비밀번호를 잊으셨나요?</a></p>
                <p>계정이 없나요? <a href="#">회원가입</a></p>
            </div>

            <p id="status" class="status-message"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
